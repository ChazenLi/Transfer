<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>$title$</title>
<meta name="description" content="$description$" />
<style>
:root{
  --bg:#fbfaf8; --panel:#ffffff; --ink:#1c1b19; --muted:#6b6762;
  --line:#e4e0da; --accent:#8c4a2f; --code-bg:#f4f1ec; --toc-bg:#f6f3ee;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#17181a; --panel:#1e2023; --ink:#e8e6e3; --muted:#9a958f;
    --line:#34383d; --accent:#d9926a; --code-bg:#25282c; --toc-bg:#202326;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.75;
}
.wrap{max-width:1220px; margin:0 auto; padding:40px 24px 80px;
  display:grid; grid-template-columns:268px minmax(0,1fr); gap:44px; align-items:start}
@media (max-width:960px){ .wrap{grid-template-columns:1fr; gap:24px; padding-top:24px} }

.page-head{grid-column:1/-1; border-bottom:2px solid var(--line); padding-bottom:20px; margin-bottom:4px}
.page-head h1{margin:0 0 6px; font-size:1.72rem; letter-spacing:.01em}
.page-head .sub{margin:0; color:var(--muted); font-size:.92rem}

nav.toc{position:sticky; top:24px; background:var(--toc-bg); border:1px solid var(--line);
  border-radius:10px; padding:16px 18px; font-size:.875rem; max-height:calc(100vh - 60px); overflow:auto}
@media (max-width:960px){ nav.toc{position:static; max-height:none} }
nav.toc > ul{padding-left:0}
nav.toc ul{list-style:none; margin:0; padding-left:14px}
nav.toc > ul > li{margin:5px 0 0}
nav.toc a{color:var(--muted); text-decoration:none; display:block; padding:1px 0}
nav.toc a:hover{color:var(--accent)}
nav.toc > ul > li > a{color:var(--ink); font-weight:600}

main{min-width:0}
main h1,main h2,main h3,main h4{line-height:1.35; margin:1.9em 0 .6em}
main h2{font-size:1.34rem; padding-bottom:8px; border-bottom:1px solid var(--line)}
main h3{font-size:1.1rem}
main h4{font-size:1rem; color:var(--muted)}
main > h1:first-child{display:none}
p,ul,ol{margin:.75em 0}
li{margin:.3em 0}
a{color:var(--accent)}
hr{border:0; border-top:1px solid var(--line); margin:2.2em 0}
blockquote{margin:1em 0; padding:.7em 1.1em; border-left:3px solid var(--accent);
  background:var(--toc-bg); border-radius:0 8px 8px 0; color:var(--ink)}
blockquote p{margin:.35em 0}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  font-size:.875em; background:var(--code-bg); padding:.12em .38em; border-radius:4px;
  word-break:break-word}
pre{background:var(--code-bg); border:1px solid var(--line); border-radius:8px;
  padding:14px 16px; overflow:auto; font-size:.85rem; line-height:1.6}
pre code{background:none; padding:0; font-size:1em}
table{border-collapse:collapse; width:100%; margin:1.1em 0; font-size:.9rem; display:block; overflow-x:auto}
th,td{border:1px solid var(--line); padding:8px 11px; text-align:left; vertical-align:top}
th{background:var(--toc-bg); font-weight:600; white-space:nowrap}
tr:nth-child(even) td{background:color-mix(in srgb, var(--toc-bg) 45%, transparent)}
footer{grid-column:1/-1; margin-top:56px; padding-top:20px; border-top:1px solid var(--line);
  color:var(--muted); font-size:.84rem}
@media print{
  nav.toc{display:none} .wrap{display:block; max-width:none; padding:0}
  body{background:#fff; color:#000; font-size:11pt}
  table{display:table} pre{white-space:pre-wrap}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="page-head">
    <h1>$title$</h1>
    <p class="sub">$subtitle$</p>
  </header>
  <nav class="toc" id="TOC">$toc$</nav>
  <main>$body$</main>
  <footer>$footer$</footer>
</div>
</body>
</html>
